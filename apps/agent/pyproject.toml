[project]
name = "shopflow-print-agent"
version = "0.1.0"
description = "PDF-first shared thermal print agent for ShopFlow (Phase 2D-2)"
requires-python = ">=3.12"
dependencies = [
  "pymupdf>=2.0,<3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
